schema = 2
id = "koreader"
name = "KOReader"
kind = "user"
description = "Disposable KO_HOME acceptance instance"
version = "2026.03-test"
package = "koreader-for-remagic"
supported_devices = ["paper_pro", "paper_pro_move"]
required_remagic_api = 2
uninstall_policy = "keep_data"
exec = "/__REMAGIC_KOREADER_ADAPTER_ROOT__/bin/koreader-for-remagic"
working_dir = "/__REMAGIC_KOREADER_VENDOR_ROOT__"
display = "qtfb"
resident = true
capabilities = ["display:qtfb-v1", "input:touch-v1", "lifecycle:v2"]
supports_open_path = true
allowed_open_roots = [
  "/home/root/.local/state/remagic/acceptance/current/koreader/library-state/library",
  "/home/root/.local/state/remagic/acceptance/current/koreader/source-library",
  "/home/root/.local/state/remagic/acceptance/current/koreader/local-books",
]

[readiness]
mode = "first_frame"
# Match the production adapter's cold-start budget. A fresh KO_HOME has to
# build KOReader's font and configuration caches on the slower Move before it
# can publish semantic readiness; warm starts still complete immediately.
timeout_ms = 60000

[shutdown]
graceful_timeout_ms = 3500
term_timeout_ms = 4500
kill_timeout_ms = 5500

[data_schema]
version = 2
migrator = "/__REMAGIC_KOREADER_ADAPTER_ROOT__/libexec/koreader-data-migrate"
backup_paths = [
  "/home/root/.local/state/remagic/acceptance/current/koreader/data",
]
backup_timeout_ms = 30000
migration_timeout_ms = 30000

[runtime]
profile = "qtfb_compat"
background_execution = "freeze"
required_libraries = []

[runtime.directories]
home = "/home/root"
config_home = "/home/root/.local/state/remagic/acceptance/current/koreader/config"
data_home = "/home/root/.local/state/remagic/acceptance/current/koreader/data"
state_home = "/home/root/.local/state/remagic/acceptance/current/koreader/state"
cache_home = "/home/root/.local/state/remagic/acceptance/current/koreader/cache"
runtime_dir = "/run/remagic/apps/koreader"

[runtime.locale]
lang = "C.UTF-8"

[runtime.timezone]
name = "Asia/Shanghai"

[runtime.fonts]
directories = ["/__REMAGIC_KOREADER_ADAPTER_ROOT__/share/fonts"]

[runtime.certificates]
required = false

[runtime.network]
mode = "deny"

[environment]
KOREADER_DIR = "/__REMAGIC_KOREADER_VENDOR_ROOT__"
KOREADER_LIBEXEC_DIR = "/__REMAGIC_KOREADER_ADAPTER_ROOT__/libexec"
KO_HOME = "/home/root/.local/state/remagic/acceptance/current/koreader/data"
KOREADER_DATA_DIR = "/home/root/.local/state/remagic/acceptance/current/koreader/data"
KOREADER_SETTINGS = "/home/root/.local/state/remagic/acceptance/current/koreader/data/settings.reader.lua"
KOREADER_BACKUP_ROOT = "/home/root/.local/state/remagic/acceptance/current/koreader/backups"
KOREADER_LEGACY_DATA_DIRS = "/home/root/.local/state/remagic/acceptance/current/koreader/empty-legacy"
KOREADER_LIBRARY_STATE_ROOT = "/home/root/.local/state/remagic/acceptance/current/koreader/library-state"
KOREADER_SOURCE_LIBRARY_DIR = "/home/root/.local/state/remagic/acceptance/current/koreader/source-library"
KOREADER_BOOKS_DIR = "/home/root/.local/state/remagic/acceptance/current/koreader/local-books"
KOREADER_LIBRARY_DIR = "/home/root/.local/state/remagic/acceptance/current/koreader/library-state/library"
KOREADER_ACTIVE_STARTUP_SCRIPT = "/home/root/.local/state/remagic/acceptance/current/koreader/runtime/koreader.sh"
KOREADER_ALLOWED_OPEN_ROOTS = "/home/root/.local/state/remagic/acceptance/current/koreader/library-state/library:/home/root/.local/state/remagic/acceptance/current/koreader/source-library:/home/root/.local/state/remagic/acceptance/current/koreader/local-books"

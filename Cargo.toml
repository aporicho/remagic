[workspace]
resolver = "2"
members = [
    "crates/remagic-core",
    "crates/remagic-protocol",
    "crates/remagicd",
    "crates/remagic-runner",
    "crates/remagic-home",
    "crates/remagicctl",
    "crates/remagic-vellum-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/aporicho/remagic-manager"

[workspace.dependencies]
ab_glyph = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "process", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[workspace]
resolver = "2"
members = [
    "crates/remagic-app-sdk",
    "crates/remagic-device",
    "crates/remagic-core",
    "crates/remagic-package",
    "crates/remagic-protocol",
    "crates/remagicd",
    "crates/remagic-runner",
    "crates/remagic-home",
    "crates/remagicctl",
    "crates/remagic-vellum-worker",
    "crates/remagic-agentd",
    "crates/remagic-update",
]

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/aporicho/remagic"

[workspace.dependencies]
ab_glyph = "0.2"
base64 = "0.22"
flate2 = "1"
hex = "0.4"
libc = "0.2"
png = "0.17"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "signal", "process", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[package]
name = "remagic-display-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Single-owner display and input host for the ReMagic managed domain"
build = "build.rs"

# This host is cross-built with the reMarkable SDK independently from the
# Rust supervisor workspace because its device feature links the Qt/vendor
# backed libquill.so.
[workspace]

[features]
default = []
device = []

[dependencies]
libc = "0.2"
remagic-device = { path = "../../crates/remagic-device" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
thiserror = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1

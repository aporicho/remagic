[Service]
# KOReader may read books and official-system metadata, but its home writes are
# limited to its own data, cache, acceptance fixture, and deployment-lock
# inode. The installer operates outside this private mount namespace.
ReadOnlyPaths=/home/root
ReadWritePaths=/home/root/.local/share/koreader-for-remagic
ReadWritePaths=/home/root/.local/state/koreader-for-remagic
ReadWritePaths=/home/root/.cache/koreader-for-remagic
ReadWritePaths=/home/root/.config/koreader-for-remagic
ReadWritePaths=-/home/root/.local/state/remagic/acceptance/current/koreader
ReadWritePaths=-/home/root/apps/.koreader-for-remagic.install.lock
PrivateMounts=yes
InaccessiblePaths=-/run/systemd/private
InaccessiblePaths=-/run/dbus/system_bus_socket
InaccessiblePaths=-/var/run/dbus/system_bus_socket

# KOReader requires no privileged kernel operation in the QTFB runtime. An
# empty bounding/ambient set prevents exec from recovering kernel capabilities.
# The process remains uid 0 for current reMarkable/QTFB compatibility, so this
# is trusted-code confinement rather than an adversarial plugin sandbox.
CapabilityBoundingSet=
AmbientCapabilities=
NoNewPrivileges=yes
ProtectSystem=full
ProtectProc=invisible
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectKernelLogs=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictSUIDSGID=yes
